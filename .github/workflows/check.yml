name: check

on:
  push:
    branches: ['**']
  pull_request:

# A superseded run tells you nothing useful, so cancel it rather than pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite and the built-in test runner are why the floor is 22.5.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: node --test "dist/test/**/*.test.js"

      - name: Verify the export manifest covers the schema
        run: node scripts/verify-manifest.mjs
