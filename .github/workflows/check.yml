name: check

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite and the built-in test runner are why the floor is 22.5.
          node-version: '22'
          cache: npm

      # @huggingface/transformers is an optionalDependency whose onnxruntime-node
      # postinstall fetches native binaries; that failure is tolerated by design
      # and the CLI falls back to the lexical embedder.
      - run: npm ci

      - name: Core — typecheck, test, verify export manifest
        run: npm run check -w @cognis/core

      - name: CLI — typecheck and test
        run: npm run check -w @cognis/cli
